<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Schulte Table</title>
<meta name="description" content="Tap the numbers in order as fast as you can.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b111c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schulte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  /* One-screen layout: header, HUD, square board (fills what's left), stats footer.
     Cool test-card paper and navy ink with a cobalt "target" accent; system font for native iOS digits. */
  :root {
    color-scheme: light;
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #e2e7ee;
    --ink: #0f1a2b;
    --muted: #5f6b7d;
    --line: #d5dce6;
    --accent: #2b59ff;
    --accent-ink: #ffffff;
    --accent-soft: #dfe7ff;
    --accent-text: #1f45d6;
    --accent-glow: rgba(43, 89, 255, 0.4);
    --bad: #e5484d;
    --veil: rgba(238, 241, 245, 0.55);
    --shadow: 0 1px 2px rgba(15, 26, 43, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b111c;
      --surface: #141c2b;
      --surface-2: #1c2638;
      --ink: #eef2f8;
      --muted: #8a96a8;
      --line: #243045;
      --accent: #4c74ff;
      --accent-ink: #ffffff;
      --accent-soft: #1a2a57;
      --accent-text: #8ea8ff;
      --accent-glow: rgba(76, 116, 255, 0.35);
      --bad: #ff5c61;
      --veil: rgba(11, 17, 28, 0.5);
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b111c;
    --surface: #141c2b;
    --surface-2: #1c2638;
    --ink: #eef2f8;
    --muted: #8a96a8;
    --line: #243045;
    --accent: #4c74ff;
    --accent-ink: #ffffff;
    --accent-soft: #1a2a57;
    --accent-text: #8ea8ff;
    --accent-glow: rgba(76, 116, 255, 0.35);
    --bad: #ff5c61;
    --veil: rgba(11, 17, 28, 0.5);
    --shadow: none;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .app {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    gap: 14px;
    padding:
      max(env(safe-area-inset-top), 14px)
      max(env(safe-area-inset-right), 16px)
      max(env(safe-area-inset-bottom), 14px)
      max(env(safe-area-inset-left), 16px);
  }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; }
  .brand { margin: 0; display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
  .brand::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--accent); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
  .seg button {
    appearance: none; border: 0; background: transparent;
    min-width: 54px; padding: 7px 12px; border-radius: 9px;
    color: var(--muted); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
  .quit {
    display: none; align-items: center; appearance: none;
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-size: 14px; font-weight: 600;
  }
  [data-state="play"] .seg { display: none; }
  [data-state="play"] .quit { display: inline-flex; }

  /* HUD */
  .hud {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--surface); border-radius: 16px;
    box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
  }
  .stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .label { font-size: 11px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .value { font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #next { color: var(--accent-text); }

  /* Board */
  .stage { container-type: size; display: grid; place-items: center; min-height: 0; }
  .board {
    position: relative;
    width: min(calc(100vw - 32px), calc(100dvh - 300px));
    width: min(100cqw, 100cqh);
    aspect-ratio: 1;
    container-type: inline-size;
  }
  .cells {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(var(--n), 1fr);
    grid-template-rows: repeat(var(--n), 1fr);
    gap: max(5px, 1.8cqw);
  }
  .cell {
    appearance: none; border: 0; margin: 0; padding: 0;
    display: grid; place-items: center;
    background: var(--surface); color: var(--ink);
    border-radius: calc(100cqw / var(--n) * 0.17);
    box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
    font-size: calc(100cqw / var(--n) * 0.4);
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    touch-action: manipulation;
  }
  [data-mark="on"] .cell.found { background: transparent; color: var(--muted); opacity: 0.4; }
  .cell.hit { animation: hit 0.24s ease-out; }
  .cell.miss { animation: miss 0.36s ease-out; }
  @keyframes hit {
    from { background: var(--accent); color: var(--accent-ink); opacity: 1; transform: scale(0.92); }
  }
  @keyframes miss {
    0% { background: var(--bad); color: #fff; }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  /* Overlay: start + result */
  .overlay {
    position: absolute; inset: -6px;
    display: grid; place-items: center;
    border-radius: 22px;
    background: var(--veil);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  [data-state="play"] .overlay { display: none; }
  .panel { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 20px; text-align: center; }
  [data-state="idle"] .panel-start,
  [data-state="done"] .panel-done { display: flex; }
  .btn {
    appearance: none; border: 0;
    padding: 17px 44px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 20px; font-weight: 700; letter-spacing: -0.01em;
    box-shadow: 0 10px 24px -10px var(--accent-glow);
    transition: transform 0.08s;
  }
  .btn:active { transform: scale(0.96); }
  .hint { margin: 4px 0 0; max-width: 26ch; font-size: 15px; color: var(--ink); }
  .hint small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .result { font-size: 68px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .result small { font-size: 0.4em; font-weight: 700; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
  .badge {
    display: inline-flex; padding: 4px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-text);
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .sub { margin: 0 0 6px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Footer */
  .foot { display: flex; flex-direction: column; gap: 10px; }
  [data-state="play"] .foot { visibility: hidden; }
  .foot-head { display: flex; justify-content: space-between; align-items: baseline; }
  .avg { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .avg b { color: var(--ink); font-weight: 650; }
  .chips { display: flex; gap: 6px; min-height: 30px; overflow: hidden; }
  .chip {
    flex: none; padding: 5px 10px; border-radius: 999px;
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .chip.is-best { background: var(--accent-soft); color: var(--accent-text); box-shadow: none; }
  .empty { align-self: center; font-size: 14px; color: var(--muted); }
  .foot-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
  .toggle { display: flex; align-items: center; gap: 8px; }
  .toggle input { margin: 0; accent-color: var(--accent); }
  .link {
    appearance: none; border: 0; background: none; padding: 6px 0;
    color: var(--muted); font-size: 14px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .link.armed { color: var(--bad); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app" id="app" data-state="idle" data-mark="on">
  <header class="top">
    <h1 class="brand">Schulte</h1>
    <div class="seg" id="sizes" role="radiogroup" aria-label="Grid size">
      <button type="button" role="radio" data-n="4">4×4</button>
      <button type="button" role="radio" data-n="5">5×5</button>
      <button type="button" role="radio" data-n="6">6×6</button>
    </div>
    <button type="button" class="quit" id="quit">Quit</button>
  </header>

  <section class="hud" aria-live="off">
    <div class="stat"><span class="label">Time</span><span class="value" id="time">0.00</span></div>
    <div class="stat"><span class="label">Find</span><span class="value" id="next">1</span></div>
    <div class="stat"><span class="label">Best</span><span class="value" id="best">–</span></div>
  </section>

  <main class="stage">
    <div class="board" id="board">
      <div class="cells" id="cells"></div>
      <div class="overlay">
        <div class="panel panel-start">
          <button type="button" class="btn" id="start">Start</button>
          <p class="hint"><span id="hint">Tap 1 → 25 in order.</span><small>The grid appears when the timer starts.</small></p>
        </div>
        <div class="panel panel-done">
          <span class="label">Your time</span>
          <div class="result"><span id="result">0.00</span><small>s</small></div>
          <span class="badge" id="badge" hidden>New best</span>
          <p class="sub" id="sub"></p>
          <button type="button" class="btn" id="again">Play again</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="foot-head">
      <span class="label">Recent</span>
      <span class="avg" id="avg"></span>
    </div>
    <div class="chips" id="recent"></div>
    <div class="foot-row">
      <label class="toggle"><input type="checkbox" id="mark" switch> Mark found numbers</label>
      <button type="button" class="link" id="reset">Reset stats</button>
    </div>
  </footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const app = $('app'), board = $('board'), cells = $('cells');
  const timeEl = $('time'), nextEl = $('next'), bestEl = $('best');
  const SIZES = [4, 5, 6];
  const KEEP_RUNS = 50;
  const STORE_KEY = 'schulte:v1';

  // ---- Persistence ----
  const data = { n: 5, mark: true, runs: {}, best: {} };
  try { Object.assign(data, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch {}
  if (!SIZES.includes(data.n)) data.n = 5;
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {} };

  // ---- Haptics: Android has vibrate(); iOS 18+ plays a tick when a switch checkbox is toggled via its label ----
  const haptic = (() => {
    if (navigator.vibrate) return () => navigator.vibrate(25);
    const label = document.createElement('label');
    label.setAttribute('aria-hidden', 'true');
    label.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.setAttribute('switch', '');
    label.append(input);
    document.body.append(label);
    return () => label.click();
  })();

  // ---- Game state ----
  let state = 'idle';            // idle | play | done
  let next = 1, total = 0, mistakes = 0, t0 = 0, raf = 0;

  const fmt = (ms) => (ms / 1000).toFixed(2);
  const setState = (s) => { state = s; app.dataset.state = s; };

  function shuffled(count) {
    const a = Array.from({ length: count }, (_, i) => i + 1);
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Empty tiles only: numbers don't exist in the page until the timer starts.
  function blankBoard() {
    board.style.setProperty('--n', data.n);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < data.n * data.n; i++) {
      const tile = document.createElement('div');
      tile.className = 'cell';
      frag.append(tile);
    }
    cells.replaceChildren(frag);
    $('hint').textContent = `Tap 1 → ${data.n * data.n} in order.`;
  }

  function start() {
    total = data.n * data.n;
    next = 1;
    mistakes = 0;
    board.style.setProperty('--n', data.n);
    const frag = document.createDocumentFragment();
    for (const v of shuffled(total)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.textContent = v;
      b.dataset.v = v;
      frag.append(b);
    }
    cells.replaceChildren(frag);
    nextEl.textContent = '1';
    setState('play');
    t0 = performance.now();
    tick();
  }

  function tick() {
    timeEl.textContent = fmt(performance.now() - t0);
    raf = requestAnimationFrame(tick);
  }

  function flash(el, cls) {
    el.classList.remove('hit', 'miss');
    void el.offsetWidth; // restart the animation
    el.classList.add(cls);
  }

  function press(el) {
    if (state !== 'play' || !el || !el.dataset.v) return;
    const v = Number(el.dataset.v);
    if (v === next) {
      el.classList.add('found');
      flash(el, 'hit');
      if (next === total) return finish();
      next++;
      nextEl.textContent = next;
    } else if (v > next) {
      // Re-tapping an already found number is ignored, not a mistake.
      mistakes++;
      flash(el, 'miss');
      haptic();
    }
  }

  function finish() {
    const ms = Math.round(performance.now() - t0);
    cancelAnimationFrame(raf);
    timeEl.textContent = fmt(ms);
    nextEl.textContent = '✓';

    const key = String(data.n);
    const prev = data.best[key];
    const isBest = prev == null || ms < prev;
    if (isBest) data.best[key] = ms;
    const runs = (data.runs[key] ||= []);
    runs.unshift({ t: ms, m: mistakes, d: Date.now() });
    runs.splice(KEEP_RUNS);
    save();

    $('result').textContent = fmt(ms);
    $('badge').hidden = !isBest;
    const miss = `${mistakes} mistake${mistakes === 1 ? '' : 's'}`;
    $('sub').textContent = isBest
      ? (prev == null ? miss : `${miss} · was ${fmt(prev)}s`)
      : `${miss} · best ${fmt(prev)}s`;

    setState('done');
    renderStats();
    haptic();
  }

  function quit() {
    cancelAnimationFrame(raf);
    timeEl.textContent = '0.00';
    nextEl.textContent = '1';
    blankBoard();
    setState('idle');
  }

  function setSize(n) {
    if (state === 'play') return;
    data.n = n;
    save();
    for (const b of $('sizes').children) b.setAttribute('aria-checked', String(Number(b.dataset.n) === n));
    timeEl.textContent = '0.00';
    nextEl.textContent = '1';
    blankBoard();
    setState('idle');
    renderStats();
  }

  function renderStats() {
    const key = String(data.n);
    const best = data.best[key];
    const runs = data.runs[key] || [];
    bestEl.textContent = best == null ? '–' : fmt(best);

    const recent = $('recent');
    if (!runs.length) {
      const p = document.createElement('span');
      p.className = 'empty';
      p.textContent = 'No runs yet on this size.';
      recent.replaceChildren(p);
    } else {
      recent.replaceChildren(...runs.slice(0, 8).map((r) => {
        const c = document.createElement('span');
        c.className = 'chip' + (r.t === best ? ' is-best' : '');
        c.textContent = fmt(r.t);
        return c;
      }));
    }

    const last = runs.slice(0, 5);
    $('avg').innerHTML = last.length >= 2
      ? `avg of last ${last.length} <b>${fmt(last.reduce((s, r) => s + r.t, 0) / last.length)}s</b>`
      : '';
  }

  // ---- Input ----
  cells.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const el = e.target.closest('.cell');
    if (!el) return;
    e.preventDefault();
    press(el);
  });
  // Keyboard activation (Enter/Space on a focused cell) arrives as a click with detail 0.
  cells.addEventListener('click', (e) => { if (e.detail === 0) press(e.target.closest('.cell')); });

  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('quit').addEventListener('click', quit);
  $('sizes').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-n]');
    if (b) setSize(Number(b.dataset.n));
  });
  $('mark').addEventListener('change', (e) => {
    data.mark = e.target.checked;
    app.dataset.mark = data.mark ? 'on' : 'off';
    save();
  });
  // Two-tap confirm (no system dialog): first tap arms the button for 3 seconds.
  let resetArmed = 0;
  $('reset').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (!resetArmed) {
      btn.textContent = 'Tap again to reset';
      btn.classList.add('armed');
      resetArmed = setTimeout(() => { resetArmed = 0; btn.textContent = 'Reset stats'; btn.classList.remove('armed'); }, 3000);
      return;
    }
    clearTimeout(resetArmed);
    resetArmed = 0;
    btn.textContent = 'Reset stats';
    btn.classList.remove('armed');
    data.runs = {};
    data.best = {};
    save();
    renderStats();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state === 'play') quit(); });

  // Keep the screen still on iPhone: no rubber-band scrolling, pinch or double-tap zoom.
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  // ---- Init ----
  $('mark').checked = data.mark;
  app.dataset.mark = data.mark ? 'on' : 'off';
  setSize(data.n);

  // Offline support once installed (only when served over https/localhost as a top-level page).
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  if ('serviceWorker' in navigator && window.top === window.self && (location.protocol === 'https:' || local)) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
